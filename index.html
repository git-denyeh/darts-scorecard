<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>TVYC Darts</title></head>
<body style="margin:0;background:#140e0a;color:#c4b59a;font-family:system-ui;padding:16px">
<p>Loading TVYC Darts v1.2.0…</p>
<script>
(async () => {
  const n = 4;
  const parts = [];
  for (let i = 1; i <= n; i++) {
    const id = String(i).padStart(2,'0');
    const r = await fetch('./boot.p' + id + '?v=120');
    if (!r.ok) throw new Error('boot.p' + id + ' ' + r.status);
    parts.push(await r.text());
  }
  document.open(); document.write(parts.join('')); document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="color:#c9a227">Load failed: ' + e + '</pre>';
});
</script></body></html>
