name: Publish v1.2.3 scorecard
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload.all.* to index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = sorted(Path('.').glob('payload.all.*'), key=lambda p: p.name)
          if not parts:
              raise SystemExit('no payload.all.* files')
          joined = ''.join(p.read_text().replace('\n','').replace('\r','') for p in parts)
          repairs = [
            ('65q+8GCydi5sWdI', '65q+8WCydi5sWdI'),
            ('zQqVpooLW0yUs9U0', 'zQqVpooLU0yUs9U0'),
            ('UfJRnVZKHU10BaT', 'UfJRnTZKHU10BaT'),
            ('bJA0TuidGqCHbhv', 'bJA0TUidGqCHbhv'),
          ]
          for bad, good in repairs:
              if bad in joined:
                  joined = joined.replace(bad, good, 1)
                  print('repaired', bad[:16])
          print(f'parts={len(parts)} joined={len(joined)} mod4={len(joined)%4}')
          if len(joined) % 4 != 0:
              raise SystemExit(f'mod4={len(joined)%4}')
          html = gzip.decompress(base64.b64decode(joined, validate=True))
          if len(html) < 100000:
              raise SystemExit(f'too small {len(html)}')
          for marker in [b'1.2.3', b'Come for the darts', b'syncLeagueFromMirror', b'menu-rules', b'sourceModifiedAt']:
              if marker not in html:
                  raise SystemExit(f'missing marker {marker}')
          Path('index.html').write_bytes(html)
          print(f'Wrote index.html bytes={len(html)} sha256={hashlib.sha256(html).hexdigest()}')
          PY
          wc -c index.html
      - name: Assemble league/2026-27.json from payload.league.*
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          parts = sorted(Path('.').glob('payload.league.*'), key=lambda p: p.name)
          if not parts:
              print('no payload.league.*; skip')
              raise SystemExit(0)
          joined = ''.join(p.read_text().replace('\n','').replace('\r','') for p in parts)
          obj = json.loads(joined)
          assert obj.get('schema') == 'tvyc-darts-league/v1'
          Path('league').mkdir(exist_ok=True)
          Path('league/2026-27.json').write_text(json.dumps(obj, separators=(',',':')))
          print('wrote league/2026-27.json', Path('league/2026-27.json').stat().st_size)
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html league/2026-27.json || git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "v1.2.3 expand: write index.html from payload.all.*"
          git push
