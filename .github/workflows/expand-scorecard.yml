name: Expand scorecard
on:
  push:
    paths:
      - 'payload.p*'
      - '.github/workflows/expand-scorecard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixes = {
              'payload.p03': ('Rdnm+H2wLx', 'Rdnm+2HwwLx'),
              'payload.p05': ('QOd3V92', 'QOd3dV92'),
              'payload.p12': ('ZVYU0E', 'ZVJYU0E'),
          }
          for name, (old, new) in fixes.items():
              p = Path(name)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected repair marker in {name}')
              p.write_text(s.replace(old, new))
          PY
          cat payload.p01 payload.p02 payload.p03 payload.p04 payload.p05 payload.p06 payload.p07 payload.p08 payload.p09 payload.p10 payload.p11 payload.p12 | base64 -d | gzip -dc > index.html
          wc -c index.html
          grep -F '1.0.4' index.html | head -1
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "v1.0.4 expand: count labels + doubles throwers for mobile test"
          git push
