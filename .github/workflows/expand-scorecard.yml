name: Expand scorecard
on:
  push:
    paths:
      - 'payload.p*'
      - '.github/workflows/expand-scorecard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          fixes = {
              'payload.p03': ('EWm+JwUZ', 'EW3m+JwUZ'),
              'payload.p05': ('QOd3V92', 'QOd3dV92'),
              'payload.p12': ('ZVYU0E', 'ZVJYU0E'),
          }
          parts = []
          for i in range(1, 13):
              p = Path(f'payload.p{i:02d}')
              s = p.read_text()
              if p.name in fixes:
                  old, new = fixes[p.name]
                  s = s.replace(old, new)
              parts.append(s)
          payload = base64.b64decode(''.join(parts), validate=True)
          Path('index.html').write_bytes(gzip.decompress(payload))
          PY
          wc -c index.html
          grep -F '1.0.4' index.html | head -1
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "v1.0.4 expand: count labels + doubles throwers for mobile test"
          git push
