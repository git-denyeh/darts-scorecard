name: Expand scorecard
on:
  # Manual only — do not run on every payload.p* push (was flooding failure emails).
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          parts = []
          files = sorted(Path('.').glob('payload.p*'), key=lambda p: p.name)
          if not files:
              raise SystemExit('no payload.p* files')
          for p in files:
              parts.append(p.read_text().rstrip('\n'))
          payload = base64.b64decode(''.join(parts), validate=True)
          html = gzip.decompress(payload)
          Path('index.html').write_bytes(html)
          print('bytes', len(html))
          m = re.search(rb'1\.0\.\d[^<]{0,60}', html)
          print('version', m.group(0).decode() if m else 'unknown')
          PY
          wc -c index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          VER=$(grep -oE '1\.0\.[0-9]+' index.html | head -1 || echo 'scorecard')
          git commit -m "${VER} expand: write index.html from payload parts"
          git push
