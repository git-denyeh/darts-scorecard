name: Fix payload character patches
on:
  workflow_dispatch:
    inputs:
      path:
        description: payload path e.g. payload.p05
        required: true
        type: string
      fixes:
        description: JSON list of [index, "char"] replacements
        required: true
        type: string
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply character fixes
        env:
          TARGET_PATH: ${{ inputs.path }}
          FIXES_JSON: ${{ inputs.fixes }}
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["TARGET_PATH"])
          fixes = json.loads(os.environ["FIXES_JSON"])
          raw = path.read_text()
          s = list(raw)
          for item in fixes:
              i, ch = item[0], item[1]
              if len(ch) != 1:
                  raise SystemExit(f"bad char at {i}: {ch!r}")
              if i < 0 or i >= len(s):
                  raise SystemExit(f"index out of range {i} len={len(s)}")
              print(f"fix {i}: {s[i]!r} -> {ch!r}")
              s[i] = ch
          path.write_text("".join(s))
          print(f"wrote {path} bytes={path.stat().st_size}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.path }}"
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "fix chars in ${{ inputs.path }}"
          git push
