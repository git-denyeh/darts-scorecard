name: Seed v1.2.1 remaining payloads
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack rem121 parts to payload.p03-p32
        run: |
          cat rem121.p01 rem121.p02 rem121.p03 rem121.p04 rem121.p05 rem121.p06 rem121.p07 rem121.p08 | tr -d '\n' | base64 -d > rem121.tar.gz
          tar -xzf rem121.tar.gz
          ls -la payload.p03 payload.p16 payload.p32
          wc -c payload.p*
      - name: Verify full decode with existing p01-p02
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          parts=[pathlib.Path(f"payload.p{i:02d}").read_text().strip() for i in range(1,33)]
          html=gzip.decompress(base64.b64decode("".join(parts)))
          h=hashlib.sha256(html).hexdigest()
          print(len(html), h)
          assert h=="b53b348cf7677a82143e46619a55a9f27fbd8df902e5f6a753385b151a33297b"
          assert b"1.2.1" in html and b"in-app standings" in html
          assert b"menu-standings" in html
          print("OK")
          PY
      - name: Commit payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload.p0[3-9] payload.p1* payload.p2* payload.p3*
          git status
          git diff --cached --quiet || git commit -m "v1.2.1 remaining payloads via rem121 parts"
          git push
